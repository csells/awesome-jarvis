name: Staleness

# Weekly check for dead links, archived, moved or stale repositories, overdue
# re-tests and Watch List changes. Keeps one issue labelled "staleness" up to date.
# See scripts/README.md.

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Update the staleness issue (untick for a dry run that only writes the job summary)
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: staleness
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts

      - name: Check and report
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          flags=()
          if [ "$PUBLISH" = "true" ]; then flags+=(--publish); fi
          python scripts/staleness.py "${flags[@]}" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
