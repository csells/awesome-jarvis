name: Staleness tests

# Offline unit tests for scripts/staleness.py and the data files it reads.
# No network checks; those run weekly in staleness.yml.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/staleness*.yml"
  push:
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/staleness*.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s scripts -v
